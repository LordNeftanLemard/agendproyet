name: agendproyet
description: Agendproyet - app de hábitos con avatar personalizable y recordatorios motivacionales.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  # Versiones fijadas a la serie 18.x / 3.x (la API cambia entre mayores)
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  flutter_timezone: ^3.0.1
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/avatar/skin/
    - assets/avatar/hair/
    - assets/avatar/beard/
    - assets/notifications/full/
    - assets/notifications/banner/
